<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8BCR3FQKXE"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-8BCR3FQKXE');
    </script>
    {%- assign page_title = page.title | append: " | " | append: site.title -%}
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
    <meta property="og:type" content="{% if page.collection == 'treks' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    {%- if page.image %}<meta property="og:image" content="{{ page.image | absolute_url }}">{% endif %}
    <link rel="alternate" type="application/rss+xml" title="Treks — {{ site.title }}" href="/treks/feed.xml">
    <link rel="alternate" type="application/json" title="Treks data" href="/treks/index.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/treks.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-name">Rajesh Gheware</a>
            <ul class="nav-links">
                <li><a href="/treks/">Treks</a></li>
                <li><a href="/#adventures">Adventures</a></li>
                <li><a href="/#contact" class="nav-cta-link">Contact →</a></li>
            </ul>
        </div>
    </nav>

    <main class="wrap">
        {{ content }}
    </main>

    <footer class="footer">
        <div>© {{ site.time | date: "%Y" }} Rajesh Gheware. Made in India 🇮🇳</div>
        <div class="footer-links">
            <a href="/treks/">All treks</a>
            <a href="/treks/feed.xml">RSS</a>
            <a href="/llms.txt">llms.txt</a>
            <a href="https://linkedin.com/in/rajesh-gheware" target="_blank" rel="noopener">LinkedIn</a>
            <a href="https://youtube.com/@ghewaredevopsai" target="_blank" rel="noopener">YouTube</a>
        </div>
    </footer>

    <!-- Cloudflare Web Analytics --><script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0eb0b28814d94a24bf01dca7088c8f79"}'></script><!-- End Cloudflare Web Analytics -->
    <script src="/assets/footer.js" defer></script>
</body>
</html>
