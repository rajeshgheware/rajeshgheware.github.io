# Jekyll config — GitHub Pages builds this automatically on push (no local build needed).
# index.html has no front matter, so Jekyll copies it unchanged.
title: Rajesh Gheware
description: Chief Architect, AI & DevOps trainer — and a trekker and long-distance cyclist.
url: https://rajeshgheware.github.io
baseurl: ""
author: Rajesh Gheware

plugins:
  - jekyll-sitemap
  - jekyll-feed

collections:
  treks:
    output: true
    permalink: /treks/:name/
  rides:
    output: true
    permalink: /rides/:name/

defaults:
  # Verification files (Google Search Console, IndexNow) stay out of the sitemap.
  - scope: { path: "google6e702c5775a34b6b.html" }
    values: { sitemap: false }
  - scope: { path: "0e4d82b72820072fda81b256b4e8bb93.txt" }
    values: { sitemap: false }
  - scope: { path: "", type: treks }
    values: { layout: trek }
  - scope: { path: "", type: rides }
    values: { layout: ride }

feed:
  collections:
    treks:
      path: /treks/feed.xml
    rides:
      path: /rides/feed.xml

